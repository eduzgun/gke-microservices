version: "2"
sql:
  - schema: "internal/db/migrations"
    queries: "internal/db/queries"
    engine: "postgresql"
    gen:
      go:
        sql_driver: "github.com/jackc/pgx/v5"
        sql_package: "pgx/v5"
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_interface: true
        overrides:
          # === TEXT → string (both nullable and non-nullable) ===
          - db_type: "text"
            nullable: false
            go_type: "string"
          - db_type: "text"
            nullable: true
            go_type: "string"

          # === int4 (SERIAL) → int (not int32) ===
          - db_type: "postgresql.int4"
            nullable: false
            go_type: "int"
          - db_type: "postgresql.int4"
            nullable: true
            go_type: "int"

          # === int8 (BIGINT) → int64 ===
          - db_type: "postgresql.int8"
            nullable: false
            go_type: "int64"
          - db_type: "postgresql.int8"
            nullable: true
            go_type: "int64"

          # === timestamptz → time.Time ===
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: "time.Time"

          # === bool → bool ===
          - db_type: "bool"
            nullable: false
            go_type: "bool"
          - db_type: "bool"
            nullable: true
            go_type: "bool"

          # === varchar → string ===
          - db_type: "varchar"
            nullable: false
            go_type: "string"
          - db_type: "varchar"
            nullable: true
            go_type: "string"

          # === char → string ===
          - db_type: "bpchar"  # PostgreSQL internal name for CHAR
            nullable: false
            go_type: "string"
          - db_type: "bpchar"
            nullable: true
            go_type: "string"

          # === UUID → string (simple) or use github.com/google/uuid if you prefer
          - db_type: "uuid"
            nullable: false
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type: "string"